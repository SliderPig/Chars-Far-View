plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0'
group = 'com.example.charlod'

base {
    archivesName = 'charlod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                charlod {
                    source sourceSets.main
                }
            }
        }
    }
}

// gradlew build -Psmoke -x test: adds the walk-through that takes screenshots in the real game. Never part of a normal jar.
if (project.hasProperty('smoke')) {
    sourceSets.main.java.srcDir 'src/smoke/java'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    maxHeapSize = '512m'
    testLogging { events 'failed'; exceptionFormat 'short' }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'   : 'charlod',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion
        ])
    }
}
